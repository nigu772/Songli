<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#090a0d"
  >

  <meta
    name="description"
    content="Songli – gemeinsame Musik für dein Event."
  >

  <title>Songli</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Spotify Web Playback SDK -->
  <script
    src="https://sdk.scdn.co/spotify-player.js"
    defer
  ></script>

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>

<body>

  <!-- Hintergrund-Effekte -->
  <div class="background-glow background-glow-1"></div>
  <div class="background-glow background-glow-2"></div>

  <!-- App -->
  <div id="app">

    <!-- Wird von app.js gefüllt -->
    <div class="app-loading">
      <div class="loading-disc"></div>
      <div class="loading-text">
        <strong>Songli</strong>
        <span>Wird geladen…</span>
      </div>
    </div>

  </div>

  <!-- Toast-Meldungen -->
  <div
    id="toast-root"
    class="toast-root"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <!-- Spotify Playback Player -->
  <div
    id="spotify-player"
    class="spotify-player"
    hidden
  ></div>

  <script src="/app.js"></script>

</body>
</html>
